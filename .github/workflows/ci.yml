name: CI

on:
  push:
    branches: [main, release]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rahasya
          POSTGRES_PASSWORD: rahasya
          POSTGRES_DB: rahasya_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rahasya:rahasya@localhost:5432/rahasya_test
      TEST_DATABASE_URL: postgresql://rahasya:rahasya@localhost:5432/rahasya_test
      # Test-only values; production secrets live in Render, never here.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      DATA_KEY: Y2ktb25seS1kYXRhLWtleS0zMi1ieXRlcy1sb25nISE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
